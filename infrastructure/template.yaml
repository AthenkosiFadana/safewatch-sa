AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
# LambdaRoleArn is intentionally allowed to be empty (empty -> the template
# creates a role, non-empty -> an existing lab role is reused), which trips
# cfn-lint's static ARN pattern check on the parameter default.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [E3031]
Description: >
  SafeWatch SA — community crime & safety monitoring platform.
  Serverless API: API Gateway -> Lambda (Python) -> DynamoDB, with SNS alerts,
  S3 evidence storage and CloudWatch monitoring.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlertTopicEmail:
    Type: String
    Default: ''
    Description: Optional email subscription for safety alert notifications (SNS)
  JwtSecretValue:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      JWT signing secret supplied at deploy time (generate with: openssl rand -hex 32).
      A weak development fallback is used when left empty.
  LambdaRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z_0-9+=,.@\-_/]+$'
    Description: >
      Optional ARN of an existing execution role to use for all Lambda functions
      (e.g. a pre-provisioned lab role). Leave empty to create a dedicated
      least-privilege role — requires iam:CreateRole permission.
  ApiMode:
    Type: String
    Default: apigateway
    AllowedValues: [apigateway, functionurl]
    Description: >
      apigateway exposes the API through Amazon API Gateway (recommended).
      functionurl exposes one Lambda Function URL running the full Flask app —
      use in environments where API Gateway is not permitted.
  EnableAlertSchedule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create the EventBridge schedule that periodically detects incident
      clusters. Disable in restricted accounts where events:DeleteRule is
      denied, so the stack stays deletable.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 15
    MemorySize: 256
    Architectures: [x86_64]
    Environment:
      Variables:
        STORAGE_BACKEND: dynamodb
        INCIDENTS_TABLE: !Ref IncidentsTable
        USERS_TABLE: !Ref UsersTable
        ALERTS_TABLE: !Ref AlertsTable
        AWS_REGION_NAME: !Ref AWS::Region
        SNS_TOPIC_ARN: !Ref AlertTopic
        S3_BUCKET: !Ref EvidenceBucket
        SECRET_KEY: !If
          - HasJwtSecretValue
          - !Ref JwtSecretValue
          - insecure-dev-secret-change-me

Resources:
  # Shared least-privilege execution role for every SafeWatch Lambda function.
  # The frontend never talks to DynamoDB directly — only these functions can.
  # Created only when no existing role ARN is supplied (LambdaRoleArn).
  SafeWatchFunctionRole:
    Condition: CreateLambdaRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub safewatch-${EnvironmentName}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: SafeWatchDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDBReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt IncidentsTable.Arn
                  - !Sub '${IncidentsTable.Arn}/index/*'
                  - !GetAtt UsersTable.Arn
                  - !GetAtt AlertsTable.Arn
              - Sid: PublishSafetyAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: EvidenceUploads
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${EvidenceBucket.Arn}/incidents/*'

  # ---------------------------------------------------------------- API ----
  SafeWatchApi:
    Condition: UseApiGateway
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub safewatch-${EnvironmentName}-api
      StageName: !Sub ${EnvironmentName}
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100

  # -------------------------------------------------------------- Lambda ---
  CreateIncidentFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-create-incident
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.create_incident.handler
      CodeUri: ../backend/
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents
            Method: POST

  GetIncidentsFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-get-incidents
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.get_incidents.handler
      CodeUri: ../backend/
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents
            Method: GET
        GetOne:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents/{id}
            Method: GET

  UpdateIncidentFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-update-incident
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.update_incident.handler
      CodeUri: ../backend/
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents/{id}
            Method: PUT
        Moderate:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents/{id}/status
            Method: PUT

  DeleteIncidentFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-delete-incident
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.delete_incident.handler
      CodeUri: ../backend/
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /incidents/{id}
            Method: DELETE

  CreateAlertFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-create-alert
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.create_alert.handler
      CodeUri: ../backend/
      Events:
        Check:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /alerts/check
            Method: POST
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /alerts
            Method: POST

  AnalyticsFunction:
    Condition: UseApiGateway
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-analytics
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.analytics.handler
      CodeUri: ../backend/
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref SafeWatchApi
            Path: /analytics
            Method: GET

  # Recurring cluster-alert evaluation every 15 minutes
  AlertSchedule:
    Condition: ScheduleEnabled
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-alert-schedule
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.create_alert.handler
      CodeUri: ../backend/
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Detect incident clusters and publish safety alerts

  # Single Lambda running the full Flask app behind a Function URL.
  # Used when ApiMode=functionurl (restricted environments without API Gateway).
  ApiRouterFunction:
    Condition: UseFunctionUrl
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub safewatch-${EnvironmentName}-api-router
      Role: !If [CreateLambdaRole, !GetAtt SafeWatchFunctionRole.Arn, !Ref LambdaRoleArn]
      Handler: lambda.wsgi.handler
      CodeUri: ../backend/
      MemorySize: 512
      Timeout: 29

  ApiRouterUrl:
    Condition: UseFunctionUrl
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiRouterFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ['*']
        AllowMethods: ['*']
        AllowHeaders: ['*']

  # ------------------------------------------------------------- Data ------
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub safewatch-${EnvironmentName}-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
        - AttributeName: area
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: area-createdAt-index
          KeySchema:
            - AttributeName: area
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub safewatch-${EnvironmentName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub safewatch-${EnvironmentName}-alerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
      KeySchema:
        - AttributeName: alert_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------ Messaging ---------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub safewatch-${EnvironmentName}-safety-alerts
      DisplayName: SafeWatch SA Safety Alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertTopicEmail

  # -------------------------------------------------------- Storage ---------
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-evidence
            Status: Enabled
            ExpirationInDays: 180

  # ------------------------------------------------------ Monitoring ---------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/safewatch-${EnvironmentName}
      RetentionInDays: 30

Conditions:
  CreateLambdaRole: !Equals [!Ref LambdaRoleArn, '']
  UseApiGateway: !Equals [!Ref ApiMode, 'apigateway']
  UseFunctionUrl: !Equals [!Ref ApiMode, 'functionurl']
  ScheduleEnabled: !Equals [!Ref EnableAlertSchedule, 'true']
  HasJwtSecretValue: !Not [!Equals [!Ref JwtSecretValue, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertTopicEmail, '']]

Outputs:
  ApiUrl:
    Condition: UseApiGateway
    Description: SafeWatch REST API endpoint (API Gateway stage)
    Value: !Sub https://${SafeWatchApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/
  FunctionApiUrl:
    Condition: UseFunctionUrl
    Description: SafeWatch REST API endpoint (Lambda Function URL)
    Value: !GetAtt ApiRouterUrl.FunctionUrl
  IncidentsTableName:
    Value: !Ref IncidentsTable
  AlertTopicArn:
    Value: !Ref AlertTopic
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
