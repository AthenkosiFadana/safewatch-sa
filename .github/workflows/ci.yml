name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Smoke test the API
        run: |
          python run.py > server.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:5001/api/health
          echo ""

  frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # oxlint resolves its native binding from optionalDependencies; make sure
      # the Linux build is present before linting.
      - name: Ensure oxlint Linux binding
        run: |
          OXLINT_VERSION=$(node -e "console.log(require('oxlint/package.json').version)")
          npm install --no-save "@oxlint/binding-linux-x64-gnu@$OXLINT_VERSION"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  infrastructure:
    name: SAM template validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate CloudFormation template
        run: sam validate --template infrastructure/template.yaml --lint
